# HÖRU 로고 배치 학습 라이브러리 v1 (2026-11-20)
# 근거: 업계 장식 가이드(Shopify·Vistaprint·Printful·SanMar 스펙시트·자수/DTF/우븐 라벨 규격) + 벤치마크 판매처 자료
#       → 출처 목록은 research/06_logo_placement_research.md. '추정' 표시는 검증 안 된 값.
# 좌표 규칙: offset_cm [dx, dy] = 기준점(landmark)에서의 거리 (기본: 로고 '중심'까지).
#            anchor: edge → dx는 로고 '가장자리'까지 거리 (업계 '옆선에서 1in 안쪽' 규칙) — 매칭기가 폭/2만큼 더 안쪽으로 이동. dx(+) = 착용자 왼쪽(정면 사진에서는 화면 오른쪽), dy(+) = 아래
#            width_cm = 로고 가로폭(실물). 매칭기가 px_per_cm로 픽셀 환산.

# ---------- 가공 방식 최소 규격 (실물 mm) ----------
techniques:
  embroidery:    {min_stroke_mm: 1.27, min_text_mm: 6.35, look: "새틴 스티치 광택 방향, 주변 미세 당김, 가장자리 실 요철", src: "Printful·CustomInk·Fourthwall 자수 가이드"}
  puff_embroidery: {min_stroke_mm: 5.0, min_text_mm: 11.0, look: "2~4mm 볼록(추정), 둥근 모서리, 측면 그림자", src: "Imperial 3D puff 가이드"}
  print:         {min_stroke_mm: 0.35, min_text_mm: 1.5, look: "잉크가 원단 결 안에 묻힘, 플라스티솔은 약간 뜬 무광", src: "TransferExpress 스크린 디테일 가이드"}
  reflective:    {min_stroke_mm: 1.0, min_text_mm: 2.0, look: "매끈한 필름층, 플래시 받으면 은회색", src: "Kolormatrix DTF 최소 규격"}
  silicone:      {min_stroke_mm: 1.2, min_text_mm: 3.0, look: "고무 반광, 0.5~1mm 두께(추정), 또렷한 경계", src: "TransferExpress·Printex 실리콘"}
  woven_label:   {min_stroke_mm: 0.2, min_text_mm: 1.5, look: "직조 결, 접힘선, 테두리 박음질", src: "LabelPartners 우븐 디자인 룰"}
  printed_label: {min_stroke_mm: 0.15, min_text_mm: 1.0, look: "새틴 광택, 평평한 인쇄 (추정)", src: "추정"}
  rubber_patch:  {min_stroke_mm: 1.0, min_text_mm: 3.0, look: "몰드 3D 단차, 둥근 엣지 (추정)", src: "추정"}
  leather_patch: {min_stroke_mm: 1.5, min_text_mm: 4.0, look: "눌린 음각이 진해짐, 가죽 결, 모서리 박음질", src: "Monterey 가죽 패치 비교"}
  engrave:       {min_stroke_mm: 0.2, min_text_mm: 1.5, look: "도장층 벗겨져 금속 노출, 무광 은색", src: "판매처 레이저 각인 설명 (추정 수치)"}
  emboss:        {min_stroke_mm: 1.5, min_text_mm: 4.0, look: "색 없이 요철", src: "추정"}
  deboss:        {min_stroke_mm: 1.5, min_text_mm: 4.0, look: "눌린 음각", src: "추정"}

# ---------- 상품별 표준 위치 ----------
products:
  top:   # 티셔츠·맨투맨·후디·재킷
    landmarks: {neck: "목둘레선 중앙 = 칼라와 몸판이 만나는 봉제선(칼라 맨 위 아님). 정면=앞, 후면=뒤", shoulder_left: "착용자 왼쪽 어깨 봉제선 끝", hem_left: "착용자 왼쪽 옆선과 밑단이 만나는 점"}
    placements:
      left_chest:   {view: front, landmark: neck, offset_cm: [10, 11], width_cm: [7.5, 10], techniques: [embroidery, print, reflective, silicone, woven_label, rubber_patch], src: "Shopify·MagneticHoop·Vistaprint"}
      left_chest_small: {view: front, landmark: neck, offset_cm: [10, 10], width_cm: [3, 5], techniques: [embroidery, reflective, silicone, print], src: "미니멀 브랜드 스몰로고 관행 (추정)"}
      center_chest: {view: front, landmark: neck, offset_cm: [0, 12], width_cm: [13, 18], techniques: [print, embroidery], src: "Vistaprint·RushOrderTees"}
      full_front:   {view: front, landmark: neck, offset_cm: [0, 22], width_cm: [25, 30], techniques: [print], src: "추정 (백 기준 준용)"}
      back_neck:    {view: back, landmark: neck, offset_cm: [0, 4], width_cm: [5, 7.5], techniques: [print, embroidery, woven_label], src: "Printful·RushOrderTees"}
      upper_back:   {view: back, landmark: neck, offset_cm: [0, 12], width_cm: [20, 30], techniques: [print, embroidery], src: "ScreenPrinting.com"}
      inner_neck:   {view: inside, landmark: neck, offset_cm: [0, 4], width_cm: [4, 7], techniques: [print, woven_label, printed_label], src: "DTF 넥라벨·Wunderlabel"}
      sleeve_upper: {view: front, landmark: shoulder_left, offset_cm: [2, 9], width_cm: [5, 7.5], techniques: [print, embroidery, reflective], src: "Printify·Shopify", note: "어깨 봉제선 피함"}
      sleeve_vertical: {view: side, landmark: shoulder_left, offset_cm: [0, 18], width_cm: [2.5, 4], length_cm: [20, 35], techniques: [print, reflective], src: "Printify 세로형 2.5×14in"}
      hem_flag:     {view: front, landmark: hem_left, offset_cm: [0, -3], width_cm: [2.5, 5], techniques: [woven_label], src: "Apliiq 플래그 1×1in·Dutch Label 헴택"}
      side_seam:    {view: side, landmark: hem_left, offset_cm: [0, -8], width_cm: [1.3, 2], techniques: [print, reflective, woven_label], src: "lululemon Metal Vent 옆선 로고 (Peloton 판매처)"}
      zipper_pull:  {view: front, landmark: zipper_top, offset_cm: [0, 1], width_cm: [1, 2], techniques: [rubber_patch, engrave], src: "추정"}
  bottom:  # 팬츠·레깅스·쇼츠
    landmarks: {waist_back: "뒤 허리밴드 중앙", hip_left: "왼쪽 허리 옆선 지점"}
    placements:
      waistband_back: {view: back, landmark: waist_back, offset_cm: [0, 2], width_cm: [3, 6], techniques: [silicone, reflective, print], src: "lululemon Align 뒤 허리 로고 (판매처 확인), 크기 추정"}
      left_hip:       {view: front, landmark: hip_left, offset_cm: [-2.5, 20], anchor: edge, width_cm: [3, 8], techniques: [print, reflective, silicone, embroidery], src: "Apliiq 바지 배치 (검색 요약)"}
      ankle:          {view: front, landmark: hem_left, offset_cm: [0, -6], width_cm: [2, 5], techniques: [reflective, silicone], src: "레깅스 발목 2in 이하"}
      back_pocket:    {view: back, landmark: pocket_back, offset_cm: [0, 0], width_cm: [3, 5], techniques: [embroidery, leather_patch, woven_label], src: "추정"}
  cap:
    landmarks: {crown_front: "앞 크라운 중앙", side_left: "착용자 왼쪽 측면 패널 중앙", back_closure: "뒤 클로저 위 중앙"}
    placements:
      front_crown:  {view: front, landmark: crown_front, offset_cm: [0, 0], width_cm: [6, 11], max_height_cm: 5.7, techniques: [embroidery, puff_embroidery, leather_patch, woven_label], src: "Printful 모자 가이드·SanMar 캡 스펙"}
      front_small:  {view: front, landmark: crown_front, offset_cm: [0, 1], width_cm: [3.5, 6], techniques: [embroidery], src: "이미스 스몰로고 자수 (판매처 확인)"}
      side_flag:    {view: side, landmark: side_left, offset_cm: [0, 0], width_cm: [5, 6.4], max_height_cm: 3.2, techniques: [embroidery], src: "New Era 착용자 왼쪽 플래그 (확인)·SanMar 최대 2.75×1.75in"}
      back_closure: {view: back, landmark: back_closure, offset_cm: [0, -2], width_cm: [5.7, 7.6], max_height_cm: 2.5, techniques: [embroidery], src: "SanMar 캡 스펙"}
      back_strap:   {view: back, landmark: back_closure, offset_cm: [0, 0], width_cm: [5, 6.4], max_height_cm: 1.0, techniques: [embroidery, engrave], src: "2.5×0.375in"}
  beanie:
    landmarks: {cuff_front: "커프 정면 중앙"}
    placements:
      cuff_patch:   {view: front, landmark: cuff_front, offset_cm: [0, 0], width_cm: [4, 6], techniques: [leather_patch, woven_label, embroidery], src: "PU 패치 5×3cm 실측 판매처"}
  bag:
    landmarks: {front_top: "전면 상단 중앙", front_pocket: "앞포켓 중앙", strap_left: "왼 어깨끈 가슴 높이"}
    placements:
      front_top_patch: {view: front, landmark: front_top, offset_cm: [0, 4], width_cm: [5, 10], techniques: [rubber_patch, woven_label, leather_patch, print], src: "JanSport SuperBreak 전면 상단 패치 (확인)"}
      front_print:     {view: front, landmark: front_top, offset_cm: [0, 6], width_cm: [6, 12], techniques: [print, reflective], src: "Salomon Trailblazer 전면 프린트 (확인)"}
      pocket:          {view: front, landmark: front_pocket, offset_cm: [0, 0], width_cm: [4, 7], techniques: [embroidery, print], src: "커스텀 옵션 (JanSport)"}
      strap_tape:      {view: front, landmark: strap_left, offset_cm: [0, 0], width_cm: [2, 3], length_cm: [6, 12], techniques: [woven_label, print, rubber_patch], src: "추정"}
  goods:   # 범용 잡화·라이프스타일 (선글라스·워치·양말·캠핑·홈·데스크 등) — 전용 배치 학습 전 임시 규칙 (추정)
    landmarks: {face_center: "가장 넓은 정면의 중앙", corner: "라벨을 달 모서리·이음선", edge: "측면·테두리 띠"}
    placements:
      face_center:  {view: front, landmark: face_center, offset_cm: [0, 0], width_cm: [3, 10], techniques: [print, engrave, emboss, deboss], src: "추정 — 품목별 실사례 학습 필요"}
      corner_label: {view: front, landmark: corner, offset_cm: [0, 0], width_cm: [3, 5], techniques: [woven_label, printed_label, leather_patch], src: "헴택·플래그 라벨 규격 준용"}
      edge_strip:   {view: side, landmark: edge, offset_cm: [0, 0], width_cm: [2, 4], techniques: [print, engrave], src: "추정"}
  tumbler:
    landmarks: {body_front: "몸통 정면 중앙(높이 중간)", body_back: "반대면 중앙"}
    placements:
      body_front:   {view: front, landmark: body_front, offset_cm: [0, 0], width_cm: [3.8, 5], max_height_cm: 7.6, techniques: [print, engrave], src: "40oz 몸통 1.5×3in (판매처)"}
      body_back:    {view: back, landmark: body_back, offset_cm: [0, 0], width_cm: [3.8, 4], techniques: [engrave], src: "Stanley 커스텀 각인: 브랜드 로고 반대면 1.5in (4imprint)"}
      body_vertical: {view: side, landmark: body_front, offset_cm: [0, 0], width_cm: [1.2, 2], length_cm: [8, 12], techniques: [print, engrave], src: "세로 측면 문구 관행 (판매처)"}

# 심볼(부엉이 얼굴) 단독 정책 (사장님 지시 2026-11-20): 되도록 단독 사용 금지 → 조합 로고·텍스트로고 우선,
#   심볼은 다른 후보가 모두 규격 미달일 때만 '예외'로 사용하고 계획서에 사유 기록 (매칭기가 자동 강제)
symbol_standalone: avoid

# ---------- 벤치마크별 적용 레시피 (benchmarks.yaml 선정 모델과 연결) ----------
# 각 줄: placement, asset 후보(앞에서부터 규격 통과하는 것 사용), technique, color
recipes:
  lululemon:        # 애슬레저 글로벌
    top:    [{placement: left_chest_small, assets: [combined, wordmark, symbol], technique: reflective, color: auto},
             {placement: side_seam, assets: [wordmark], technique: reflective, color: auto},
             {placement: back_neck, assets: ["slogan:MAIN", wordmark], technique: print, color: auto}]
    bottom: [{placement: waistband_back, assets: [wordmark, symbol], technique: silicone, color: auto},
             {placement: left_hip, assets: [wordmark, combined, symbol], technique: reflective, color: auto}]
  안다르:
    bottom: [{placement: waistband_back, assets: [wordmark], technique: print, color: auto}]
    top:    [{placement: left_chest_small, assets: [wordmark, combined, symbol], technique: print, color: auto}]
  Uniqlo:           # 영캐주얼 글로벌 — 겉 로고 최소, 라벨 중심
    top:    [{placement: inner_neck, assets: ["lockup:wordmark:SUB_A:B", wordmark], technique: print, color: auto},
             {placement: hem_flag, assets: [wordmark, combined, symbol], technique: woven_label, color: "#FFFFFF", label_color: "#1A1E36"}]
  무신사 스탠다드:
    top:    [{placement: left_chest_small, assets: [combined, wordmark, symbol], technique: embroidery, color: tone},
             {placement: back_neck, assets: [wordmark], technique: print, color: auto}]
  JanSport:
    bag:    [{placement: front_top_patch, assets: [wordmark, combined], technique: rubber_patch, color: "#FFFFFF", label_color: "#1A1E36"},
             {placement: strap_tape, assets: ["slogan:MAIN", wordmark], technique: woven_label, color: "#FFFFFF", label_color: "#2E4032"}]
  살로몬 Trailblazer:
    bag:    [{placement: front_print, assets: [combined, wordmark], technique: print, color: auto}]
  New Era:
    cap:    [{placement: front_crown, assets: [combined, wordmark, symbol], technique: embroidery, color: auto},
             {placement: side_flag, assets: [wordmark], technique: embroidery, color: auto},
             {placement: back_closure, assets: ["slogan:SUB_B", wordmark], technique: embroidery, color: auto}]
  이미스:
    cap:    [{placement: front_small, assets: [wordmark, symbol], technique: embroidery, color: tone}]
    beanie: [{placement: cuff_patch, assets: [combined, wordmark, symbol], technique: leather_patch, color: auto, label_color: "#A89C89"}]
  Stanley:
    tumbler: [{placement: body_front, assets: [combined, wordmark, symbol], technique: print, color: auto},
              {placement: body_back, assets: [wordmark, combined, symbol], technique: engrave, color: auto}]
  generic:          # 벤치마크 미선정 품목용 임시 레시피 (goods)
    goods:  [{placement: face_center, assets: [combined, wordmark, symbol], technique: print, color: auto},
             {placement: corner_label, assets: [wordmark, combined], technique: woven_label, color: "#FFFFFF", label_color: "#1A1E36"}]
  써모스 코리아:
    tumbler: [{placement: body_front, assets: [wordmark, combined], technique: print, color: auto},
              {placement: body_vertical, assets: ["slogan:SUB_B"], technique: print, color: auto}]
