# HÖRU 룩북·목업 자동화 — 브랜드 규칙 (단일 기준, Source of Truth)
# 근거: 0_HÖRU_브랜드소개서_제작지침 v1.0 (2026-08-13), HÖRU_StyleGuide_2026(최종)
# 이 파일이 바뀌면 qa_check.py 결과도 바뀐다. 변경 시 CHANGELOG에 사유 기록.
version: 1.0.0
updated: 2026-11-20

palette:            # 6색 고정 — 그래픽·텍스트 요소에만 적용 (사진 픽셀에는 적용 안 함)
  main_black:  "#040000"
  navy:        "#1E5786"
  deep_green:  "#2E4032"
  dark_navy:   "#1A1E36"
  sand_beige:  "#A89C89"
  pure_white:  "#FFFFFF"
palette_tolerance_deltaE: 6      # 이 값 초과 시 '팔레트 외 색상' 경고

typography:
  display: Cambria                 # 표지·헤딩
  body: Arial                      # 캡션·라벨·본문
  size_pt: {title: [26, 32], subtitle: [18, 22], body: [14, 16]}

logo:
  ratio: {main: 1.80, symbol: 0.935, wordmark: 2.95}   # W:H (symbol 1:1.07)
  clear_space_ratio: 0.15
  min_size: {print_mm: 25, digital_px: 100}

c_copy:
  long:  '"HÖRU" is a registered trademark of i-Licensing'
  short: "HÖRU® | A brand by i-Licensing"
  distributor: "Distributed by {company} | Under license from i-Licensing"
  required_on_templates: [T08_closing]     # 룩북 마지막 페이지 필수

compliance:
  # 국가명 배제 원칙 — "북유럽/노르딕" 지역 표현만 허용
  forbidden_terms:
    - Sweden
    - Swedish
    - Stockholm
    - Norway
    - Denmark
    - Finland
    - 스웨덴
    - 노르웨이
    - 덴마크
    - 핀란드
    - 스톡홀름
  forbidden_patterns:
    - '\d{1,2}\.\d+\s*[NS]\s+\d{1,3}\.\d+\s*[EW]'   # 좌표 표기 (예: 59.3N 18.0E)
  competitor_terms: []          # 운영 중 확인된 경쟁사명 추가 (예: 이미지 내 잔존 문구)

image:
  min_long_edge_px: {web: 2000, print: 3500}
  max_clipped_highlight_ratio: 0.02    # 255 근처 픽셀 비율 상한
  min_sharpness: 60                     # 라플라시안 분산 근사값 (낮으면 블러 의심)

virtual_model_policy:          # [결정 필요] 지침 v1.0은 'AI 티 나는 이미지 금지'만 규정
  allowed: true
  label_required: true          # Model Reference 시트에 'VIRTUAL' 표기
  forbidden_artifacts: [broken_text, extra_fingers, warped_logo, asymmetric_eyes, melted_accessory]
  registry_required: true       # model_registry에 등록된 ID만 사용 (얼굴 일관성)

scoring:
  pass_score: 85
  blockers: [compliance]          # 이 영역에서 1건이라도 실패 → 점수 무관 FAIL
  weights: {brand: 30, compliance: 25, image_quality: 25, consistency: 10, info: 10}
