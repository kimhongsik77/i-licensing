# HÖRU 룩북·목업 자동화 — 브랜드 규칙 (단일 기준, Source of Truth)
# 근거: 0_HÖRU_브랜드소개서_제작지침 v1.0 (2026-08-13), HÖRU_StyleGuide_2026(최종)
# 이 파일이 바뀌면 qa_check.py 결과도 바뀐다. 변경 시 CHANGELOG에 사유 기록.
version: 1.0.0
updated: 2026-11-20

palette:            # 6색 고정 — 그래픽·텍스트 요소에만 적용 (사진 픽셀에는 적용 안 함)
  main_black:  "#040000"
  navy:        "#1E5786"
  deep_green:  "#2E4032"
  dark_navy:   "#1A1E36"
  sand_beige:  "#A89C89"
  pure_white:  "#FFFFFF"
palette_tolerance_deltaE: 6      # 이 값 초과 시 '팔레트 외 색상' 경고

typography:
  display: Cambria                 # 표지·헤딩
  body: Arial                      # 캡션·라벨·본문
  size_pt: {title: [26, 32], subtitle: [18, 22], body: [14, 16]}

logo:
  ratio: {main: 1.80, symbol: 0.935, wordmark: 2.95}   # W:H (symbol 1:1.07)
  clear_space_ratio: 0.15
  min_size: {print_mm: 25, digital_px: 100}

logo_application:              # 사장님 지시 2026-11-20 (브랜드 오너 승인으로 기록)
  assets_allowed: [text_logo, slogan, full_logo, symbol]   # 자유 연출 가능
  placement_rule: "벤치마크 상품의 자사 로고 적용 방식(위치·크기·기법)에 준함 → benchmarks.yaml > logo_application"
  keep_shape: true               # [확인 필요] 위치·크기는 자유, 로고 형태 왜곡(비율 변형)은 금지로 가정
  sub_logo_approval: "2026-11-20 브랜드 오너 지시로 서브/응용 로고 사용 승인"

design_freedom:                  # 로고 외 상품 디자인·텍스트
  allowed: true
  principle: "HÖRU 브랜드(북유럽·미니멀·자연)를 고려해 자유 구현, 전체 완성도 우선"
  still_forbidden: ["경쟁·벤치마크 브랜드명·로고·고유 그래픽 복제", "국가명", "랜드마크"]

c_copy:
  long:  '"HÖRU" is a registered trademark of i-Licensing'
  short: "HÖRU® | A brand by i-Licensing"
  distributor: "Distributed by {company} | Under license from i-Licensing"
  required_on_templates: [T08_closing]     # 룩북 마지막 페이지 필수

compliance:
  # 국가명 배제 원칙 — "북유럽/노르딕" 지역 표현만 허용
  forbidden_terms:
    - Sweden
    - Swedish
    - Stockholm
    - Norway
    - Denmark
    - Finland
    - 스웨덴
    - 노르웨이
    - 덴마크
    - 핀란드
    - 스톡홀름
  forbidden_patterns:
    - '\d{1,2}\.\d+\s*[NS]\s+\d{1,3}\.\d+\s*[EW]'   # 좌표 표기 (예: 59.3N 18.0E)
  competitor_terms:             # 벤치마크 브랜드명 — HÖRU 결과물 텍스트에 노출되면 블로커
    - lululemon
    - 안다르
    - Uniqlo
    - 유니클로
    - 무신사 스탠다드
    - JanSport
    - 잔스포츠
    - Salomon
    - 살로몬
    - New Era
    - 뉴에라
    - 이미스
    - EMIS
    - Stanley
    - 스탠리
    - Thermos
    - 써모스

image:
  min_long_edge_px: {web: 2000, print: 3500}
  max_clipped_highlight_ratio: 0.02    # 255 근처 픽셀 비율 상한
  min_sharpness: 60                     # 라플라시안 분산 근사값 (낮으면 블러 의심)

ai_disclosure:                  # 한국 AI 기본법(2026-01-22 시행) 대응 권장 — 의무 주체 해석 엇갈림, 법무 확인 전까지 '경고'로 운영
  applies_to: "가상모델(model_id 있는) 컷"
  text: ["AI 생성 이미지", "AI-generated image"]
  blocker: false

virtual_model_policy:          # [결정 필요] 지침 v1.0은 'AI 티 나는 이미지 금지'만 규정
  allowed: true
  label_required: true          # Model Reference 시트에 'VIRTUAL' 표기
  forbidden_artifacts: [broken_text, extra_fingers, warped_logo, asymmetric_eyes, melted_accessory]
  registry_required: true       # model_registry에 등록된 ID만 사용 (얼굴 일관성)
  body_spec:                    # 착장컷 모델 체형 기준 (사장님 지시 2026-11-20) — 해외·국내 최상위 모델 체형에 준함
    female: {min_height_cm: 170, max_weight_kg: 50, age: 20}
    male:   {min_height_cm: 185, max_weight_kg: 74, age: 23}
    registry_file: config/model_registry.yaml   # 인종별 모델 등록부 (2026-11-20)
    applies_to: [T01, T02, T04, T05]   # 착장(모델) 템플릿

product_background:            # 상품컷 배경 (사장님 지시 2026-11-20)
  rule: "벤치마크 이미지의 배경에서 힌트를 얻어 자유 표현"
  still_forbidden: ["벤치마크 이미지 배경 그대로 복제", "식별 가능한 랜드마크", "타 브랜드 간판·소품 문구"]

quality_first:                  # 사장님 지시 2026-11-20: 수량보다 품질, 로고의 '실제 상품 같은 자연스러움'이 최우선
  logo_source: "BI 원본(SVG→PNG)만 합성 — AI가 로고·글자를 생성하는 방식 금지 (글자 깨짐 원천 차단)"
  logo_tool: "scripts/logo_apply.py (주름 따라가기·빛 입히기·소재감, 크레딧 0)"
  min_source_long_edge_px: 3000  # 로고 합성용 바탕컷 최소 해상도 — 작으면 실 결·잉크 질감이 뭉개짐
  logo_review:                   # 2차 검수(AI 비전·사람) 항목 — 각 1~5점, 하나라도 4점 미만이면 불합격(블로커)
    shape_fidelity: "로고 형태·비율·Ö 점·부엉이 눈이 원본과 동일한가 (깨짐·누락·왜곡 없음)"
    lighting: "로고 명암이 주변 원단/재질의 빛·그림자와 같은 방향·세기인가"
    surface_follow: "주름·곡면·원근을 따라 휘고 가려지는가 (스티커처럼 떠 보이지 않음)"
    material: "가공 방식 질감이 실물 같은가 (자수 실 결·볼륨 / 프린트 잉크 비침 / 각인 요철)"
    scale_position: "벤치마크 상품의 로고 위치·크기와 같은가, 이음선·지퍼에 걸치지 않는가"
  pass_min_each: 4
  decisions_pending:
    - "같은 색 계열(tone-on-tone) 자수·프린트 허용 여부 — BI 가이드는 블랙/화이트/네이비/딥그린만 허용 (자수로고 시안은 샌드 톤-온-톤)"
    - "실물 표현(원단 명암·자수 입체감)은 BI '그림자·효과 추가 금지' 대상이 아닌 것으로 해석 — 확인 필요"
    - "BI 가이드의 'HÖRU SWEDEN'·'원산지 스웨덴' 표기 vs 제작지침 '국가명 배제' 충돌 — 상품 로고에는 SWEDEN 없는 버전만 사용 중"

scoring:
  pass_score: 85
  blockers: [compliance, logo_realism]   # 이 영역에서 1건이라도 실패 → 점수 무관 FAIL
  weights: {logo_realism: 30, brand: 20, compliance: 20, image_quality: 15, consistency: 10, info: 5}   # 품질 우선(2026-11-20)
