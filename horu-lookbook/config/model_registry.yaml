# HÖRU 착장 가상모델 등록부 v1 (2026-11-20)
# 기준 (사장님 지시 2026-11-20): 여성 20세·170cm 이상·50kg 이하 / 남성 23세·185cm 이상·74kg 이하 / 인종별 선정
# 운영 규칙
#   - 같은 모델 ID = 같은 얼굴. 첫 생성 시 기준 시트(T01: 정면·측면·후면, 흰 배경)를 만들고 이후 모든 컷의 참조로 사용
#   - 의상은 '로고 없는 무지'로 생성 → HÖRU 로고는 placement_matcher.py로 후합성 (AI 로고 생성 금지)
#   - 체형 묘사는 '건강한 슬림·탄탄한 체형' — 지나치게 마른 모습은 브랜드(액티브·자연) 이미지와 맞지 않아 네거티브 처리
#   - 한 라인(룩) 안에서는 모델 최대 2명 (qa_check 일관성 규칙)
# status: candidate = 기준 시트 생성·사장님 확인 전 / approved = 확정

prompt_template:
  base: >-
    full-body fashion lookbook photograph of a {age}-year-old {ethnicity_en} {gender_en} model, height {height_cm} cm,
    {build}, {hair}, {face}, {skin}, calm natural expression, {pose}, {view} view,
    plain white seamless studio background, soft natural window light from the left, wearing {outfit} with no logos and no text,
    photorealistic, high detail fabric texture, 4K, 3:4
  negative: >-
    logo, brand mark, text, letters, watermark, emblem, extra fingers, distorted hands, asymmetric eyes,
    emaciated, underweight look, visible ribs, heavy makeup, tattoos, jewelry logos, landmark, country flag
  views: [front, side, back]
  default_outfit: "plain ivory crew-neck t-shirt and plain ivory wide-leg trousers, white plain sneakers"

